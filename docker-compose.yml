# ==============================================================================
# OMNIFLUX - DOCKER COMPOSE ORCHESTRATION (DEV & LOCAL TESTING)
# Single-Tenant Stack: PostgreSQL 16 + MinIO (S3 API) + Next.js App
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Banco de Dados Relacional: PostgreSQL 16 Alpine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: omniflux_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omniflux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniflux_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-omniflux_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omniflux} -d ${POSTGRES_DB:-omniflux_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - omniflux_network

  # ----------------------------------------------------------------------------
  # 2. Armazenamento de Arquivos Local (Compatível com AWS S3): MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: omniflux_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-omniflux_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-omniflux_minio_secret}
    ports:
      - "${S3_PORT:-9000}:9000"   # API S3
      - "9001:9001"              # Console Administrativo Web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - omniflux_network

  # ----------------------------------------------------------------------------
  # 3. Inicializador de Bucket MinIO (Garante o bucket padrão na subida)
  # ----------------------------------------------------------------------------
  minio-init-bucket:
    image: quay.io/minio/mc:latest
    container_name: omniflux_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-omniflux_minio_admin} ${S3_SECRET_KEY:-omniflux_minio_secret};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_NAME:-omniflux-media};
      /usr/bin/mc anonymous set download local/${S3_BUCKET_NAME:-omniflux-media};
      echo 'Bucket ${S3_BUCKET_NAME:-omniflux-media} verificado e pronto para uploads.';
      exit 0;
      "
    networks:
      - omniflux_network

  # ----------------------------------------------------------------------------
  # 4. Aplicação Principal Next.js (App Router, Standalone)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: omniflux_web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-to-a-secure-random-32-byte-secret}
      # Conexão interna entre os contêineres na rede Docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-omniflux}:${POSTGRES_PASSWORD:-omniflux_dev_password}@postgres:5432/${POSTGRES_DB:-omniflux_db}?schema=public
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-omniflux_minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-omniflux_minio_secret}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-omniflux-media}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/omniflux-media}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-15}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-image/jpeg,image/png,image/webp,application/pdf}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init-bucket:
        condition: service_completed_successfully
    networks:
      - omniflux_network

# ------------------------------------------------------------------------------
# VOLUMES PERSISTENTES
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: omniflux_postgres_data
  minio_data:
    name: omniflux_minio_data

# ------------------------------------------------------------------------------
# REDE INTERNA ISOLADA
# ------------------------------------------------------------------------------
networks:
  omniflux_network:
    name: omniflux_network
    driver: bridge
